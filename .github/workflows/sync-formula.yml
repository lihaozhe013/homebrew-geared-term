name: Sync formula with the latest nightly

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-formula
  cancel-in-progress: false

jobs:
  sync:
    name: Publish the current nightly formula
    runs-on: ubuntu-latest

    steps:
      - name: Check out tap
        uses: actions/checkout@v7

      - name: Check out geared-term
        uses: actions/checkout@v7
        with:
          repository: lihaozhe013/geared-term
          ref: publish
          path: app

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Render formula from the nightly checksum manifest
        shell: bash
        run: |
          set -euo pipefail

          sums="$(curl -fsSL https://github.com/lihaozhe013/geared-term/releases/download/nightly/SHA256SUMS.txt)"
          mapfile -t matches < <(awk '$2 ~ /^geared-term-macos-arm64-[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?\.tar\.gz$/ { print $0 }' <<<"${sums}")
          if (( ${#matches[@]} != 1 )); then
            echo "::notice::The nightly release does not yet contain one versioned macOS command-line archive; leaving the previous tap entry in place."
            exit 0
          fi

          checksum="$(awk '{print $1}' <<<"${matches[0]}")"
          asset="$(awk '{print $2}' <<<"${matches[0]}")"
          version="${asset#geared-term-macos-arm64-}"
          version="${version%.tar.gz}"

          mkdir -p Formula
          node app/apps/desktop/scripts/render-homebrew-formula.mjs \
            --version "${version}" \
            --sha256 "${checksum}" \
            --out Formula/geared-term.rb
          rm -f Casks/geared-term.rb
          rmdir Casks 2>/dev/null || true

          if ! grep -q "^  version \"${version}\"$" Formula/geared-term.rb; then
            echo "::error::The rendered formula does not pin version ${version}."
            exit 1
          fi

      - name: Push when the formula changed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'The formula already points at the current nightly.'
            exit 0
          fi

          version="$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?' Formula/geared-term.rb)"
          git commit -m "chore(formula): publish geared-term ${version}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Published Geared Term formula ${version}."