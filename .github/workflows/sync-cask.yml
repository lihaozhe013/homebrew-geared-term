name: Sync cask with the latest nightly

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cask
  cancel-in-progress: false

jobs:
  sync:
    name: Publish the current nightly cask
    runs-on: ubuntu-latest

    steps:
      - name: Check out tap
        uses: actions/checkout@v7

      - name: Check out geared-term
        uses: actions/checkout@v7
        with:
          repository: lihaozhe013/geared-term
          ref: publish
          path: app

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Render cask from the nightly checksum manifest
        shell: bash
        run: |
          set -euo pipefail

          sums="$(curl -fsSL https://github.com/lihaozhe013/geared-term/releases/download/nightly/SHA256SUMS.txt)"
          mapfile -t matches < <(grep -E ' geared-term-mac-arm64-.+\.dmg$' <<<"${sums}" || true)
          if (( ${#matches[@]} != 1 )); then
            echo "::error::Expected exactly one versioned macOS arm64 DMG in the nightly manifest, found ${#matches[@]}."
            exit 1
          fi

          checksum="$(awk '{print $1}' <<<"${matches[0]}")"
          asset="$(awk '{print $2}' <<<"${matches[0]}")"
          version="$(sed -E 's/^geared-term-mac-arm64-(.+)\.dmg$/\1/' <<<"${asset}")"

          mkdir -p Casks
          node app/apps/desktop/scripts/render-homebrew-cask.mjs \
            --version "${version}" \
            --sha256 "${checksum}" \
            --out Casks/geared-term.rb

          # A renderer that silently writes nothing would look like "already up to date" below.
          if ! grep -q "^  version \"${version}\"$" Casks/geared-term.rb; then
            echo "::error::The rendered cask does not pin version ${version}."
            exit 1
          fi

      - name: Push when the cask changed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/geared-term.rb
          if git diff --cached --quiet; then
            echo 'The cask already points at the current nightly.'
            exit 0
          fi

          version="$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?' Casks/geared-term.rb)"
          git commit -m "chore(cask): publish geared-term ${version}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Published Geared Term ${version}."
